[project]
name = "backend"
version = "0.1.0"
description = "Backend server for AI advent challenge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "flask>=2.3.3",
    "gunicorn>=25.1.0",
    "langchain>=1.2.13",
    "langchain-gigachat>=0.3.12",
    "langchain-postgres>=0.0.17",
    "langgraph>=1.1.3",
    "langgraph-checkpoint-postgres>=3.0.5",
    "psycopg2-binary>=2.9.11",
    "psycopg[binary,pool]>=3.3.3",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.48",
]

[tool.setuptools]
py-modules = []
