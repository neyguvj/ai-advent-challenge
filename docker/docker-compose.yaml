version: '3.8'

volumes:
  pg_data:


networks:
  ai:
    driver: bridge

services:
  backend:
    container_name: backend
    build:
      context: ../backend
      dockerfile: Dockerfile

    ports:
      - "${APP_PORT}:${APP_PORT}"
    networks:
      - ai
    environment:
      API_KEY: ${API_KEY}
      APP_PORT: ${APP_PORT}
      PG_HOST: ${PG_HOST}
      PG_PORT: ${PG_PORT}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DATABASE: ${PG_DATABASE}
    healthcheck:
      test: [ "CMD-SHELL", "curl -f localhost:8080/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres_db:
        condition: service_healthy
  postgres_db:
    image: postgres:16.2-alpine
    container_name: local-postgresql
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - ai
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE}" ]
      interval: 10s
      timeout: 5s
      retries: 5
